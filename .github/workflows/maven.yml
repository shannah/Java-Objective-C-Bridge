name: Java CI with Maven

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon and Intel: libjcocoa and the arm64 objc_msgSend paths
        # are tested natively on each.
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 11
        cache: maven

    - name: Build with Maven
      run: mvn --batch-mode --no-transfer-progress --update-snapshots verify

    - name: Release build of libjcocoa is universal
      run: |
        mvn --batch-mode --no-transfer-progress -Drelease=true -DskipTests generate-resources
        lipo -archs target/classes/libjcocoa.dylib
        for a in arm64 x86_64; do
          lipo -archs target/classes/libjcocoa.dylib | tr ' ' '\n' | grep -qx "$a" || { echo "::error::libjcocoa.dylib has no $a slice"; exit 1; }
        done
